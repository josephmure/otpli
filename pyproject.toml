[build-system]
requires = ["setuptools"]

[project]
name = "otpli"
version = "0.1"
description = "Perturbed-Law based Indices in the Gaussian Kullback-Leibler frame on OpenTURNS objects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openturns>=1.25", "numpy>=1.26"]
authors = [
  {name = "OpenTURNS PLI working group"},
]
license = {text = "LGPL-3.0-or-later"}
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
]

[tool.setuptools]
packages = ["otpli"]

[project.optional-dependencies]
test = ["pytest"]
doc = ["numpydoc", "sphinx"]
