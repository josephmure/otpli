[workspace]
name = "otpli"
description = "Minimal environment to run examples/plot_pli_quantile.py (otpli, OpenTURNS)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
openturns = "*"
numpy = "*"
matplotlib = "*"
ipykernel = "*"
pip = "*"
pytest = "*"
ruff = "*"

[pypi-dependencies]
otpli = { path = ".", editable = true }

[tasks]
plot = "python examples/plot_pli_quantile.py"
test = "pytest -q"
lint = "ruff check otpli test examples"
